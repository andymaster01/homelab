services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.6
    container_name: jellyfin
    restart: unless-stopped

    ports:
      - "${PORT:-8096}:8096"
      # - "8920:8920"        # HTTPS (optional)
      - "1900:1900/udp"      # DLNA discovery
      - "7359:7359/udp"      # Jellyfin client auto-discovery

    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JELLYFIN_BACKUP_DIR}
        target: /config/data/backups

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  jellyfin_config:
    driver: local
  jellyfin_cache:
    driver: local
