name: suwayomi

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    container_name: suwayomi
    restart: unless-stopped

    ports:
      - "${PORT:-4567}:4567"

    volumes:
      - type: bind
        source: ${MANGA_DOWNLOADS}
        target: /home/suwayomi/.local/share/Tachidesk/downloads
      - type: bind
        source: ${CONTAINERS_DATA}/suwayomi-files
        target: /home/suwayomi/.local/share/Tachidesk

    environment:
      TZ: ${TZ:-America/Toronto}
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: http://flaresolverr:8191
      DOWNLOAD_AS_CBZ: "true"
      EXTENSION_REPOS: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'

    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: suwayomi-flaresolverr
    restart: unless-stopped
    init: true

    environment:
      TZ: ${TZ:-America/Toronto}

  komga:
    image: gotson/komga:1.28.1
    container_name: komga
    restart: unless-stopped

    ports:
      - "25600:25600"

    volumes:
      - type: bind
        source: ${CONTAINERS_DATA}/komga-files
        target: /config
      - type: bind
        source: ${MANGA_DOWNLOADS}
        target: /data

    user: "1000:1000"

    environment:
      TZ: ${TZ:-America/Toronto}
