name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.8
    container_name: forgejo
    restart: unless-stopped

    ports:
      - "${PORT:-3000}:3000"
      - "${SSH_PORT:-2222}:22"

    volumes:
      - ${CONTAINERS_DATA:?Set CONTAINERS_DATA in the environment file}/forgejo:/data
      - /etc/localtime:/etc/localtime:ro

    environment:
      USER_UID: 1000
      USER_GID: 1000
      TZ: ${TZ:-America/Toronto}
