name: abogen

services:
  abogen:
    image: abogen:1.3.1-py310-cu126-torch2.12.0
    container_name: abogen
    build:
      context: ${CONTAINERS_DATA}/build
      dockerfile: Dockerfile
      additional_contexts:
        abogen-source: https://github.com/denizsafak/abogen.git#d30415ffe7f7439ba04f78c0617c7a1fa41f9a12
    restart: unless-stopped

    ports:
      - "${ABOGEN_PORT:-8808}:8808"

    volumes:
      - ${CONTAINERS_DATA}/incoming:/data/uploads
      - ${CONTAINERS_DATA}/output:/data/outputs
      - ${CONTAINERS_DATA}/work:/data/cache
      - ${CONTAINERS_DATA}/config:/config
      - ${CONTAINERS_DATA}/models:/models

    environment:
      ABOGEN_HOST: 0.0.0.0
      ABOGEN_PORT: 8808
      ABOGEN_SETTINGS_DIR: /config
      ABOGEN_UPLOAD_ROOT: /data/uploads
      ABOGEN_OUTPUT_DIR: /data/outputs
      ABOGEN_OUTPUT_ROOT: /data/outputs
      ABOGEN_TEMP_DIR: /data/cache
      ABOGEN_VOICE_CACHE_DIR: /models/voices
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HOME: /tmp/abogen-home
      TZ: ${TZ:-America/Toronto}

    user: "${ABOGEN_UID:-1000}:${ABOGEN_GID:-1000}"

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
