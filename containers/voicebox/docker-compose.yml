name: voicebox

services:
  voicebox:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    build:
      context: ${CONTAINERS_DATA}/build-context
    container_name: voicebox
    restart: unless-stopped

    ports:
      - "192.168.1.32:17600:17493"

    volumes:
      - ${CONTAINERS_DATA}/data:/app/data
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false
      - ${CONTAINERS_DATA}/models:/home/voicebox/.cache/huggingface

    environment:
      LOG_LEVEL: info
      NUMBA_CACHE_DIR: /tmp/numba_cache

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  mp3-converter:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    container_name: voicebox-mp3-converter
    restart: unless-stopped

    command: ["/bin/sh", "/opt/voicebox/convert-wavs.sh"]

    volumes:
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false
      - ${CONTAINERS_DATA}/converter:/opt/voicebox:ro

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
