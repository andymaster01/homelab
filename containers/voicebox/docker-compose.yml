name: voicebox

services:
  voicebox:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    build:
      context: ${CONTAINERS_DATA}/build-context
    container_name: voicebox
    restart: unless-stopped

    ports:
      - "192.168.1.32:17600:17493"

    volumes:
      - ${CONTAINERS_DATA}/data:/app/data
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false
      - ${CONTAINERS_DATA}/models:/home/voicebox/.cache/huggingface

    environment:
      LOG_LEVEL: info
      NUMBA_CACHE_DIR: /tmp/numba_cache

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  mp3-converter:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    container_name: voicebox-mp3-converter
    restart: unless-stopped

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        output_dir=/app/data/generations
        while :; do
          for wav in "$$output_dir"/*.wav; do
            [ -f "$$wav" ] || continue
            mp3=$${wav%.wav}.mp3
            if [ -f "$$mp3" ] && [ ! "$$wav" -nt "$$mp3" ]; then
              continue
            fi
            size_before=$$(stat -c '%s' "$$wav" 2>/dev/null || echo 0)
            [ "$$size_before" -gt 44 ] || continue
            sleep 2
            size_after=$$(stat -c '%s' "$$wav" 2>/dev/null || echo 0)
            [ "$$size_before" = "$$size_after" ] || continue
            temp_mp3=$${mp3%.mp3}.tmp.mp3
            if ffmpeg -nostdin -hide_banner -loglevel error -y \
              -i "$$wav" -codec:a libmp3lame -q:a 2 "$$temp_mp3"; then
              mv -f "$$temp_mp3" "$$mp3"
              echo "Created $$mp3"
            else
              rm -f "$$temp_mp3"
              echo "Could not convert $$wav" >&2
            fi
          done
          sleep 5
        done

    volumes:
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
