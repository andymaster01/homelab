name: komodo

services:
  mongo:
    image: mongo:8.0.32
    container_name: komodo-mongo
    restart: unless-stopped

    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

    ports:
      - "${PORT:-9120}:9120"

    environment:
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_TITLE: Komodo
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME:-admin}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:-komodo}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_DATABASE_DB_NAME: komodo
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_MONITORING_INTERVAL: 15-sec
      TZ: ${TZ:-America/Toronto}

    volumes:
      - core_keys:/config/keys
      - ${CONTAINERS_DATA}/backups/komodo:/backups

volumes:
  mongo_data:
  mongo_config:
  core_keys:
