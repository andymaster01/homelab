name: vikunja

services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: vikunja
    restart: unless-stopped

    ports:
      - "${PORT:-3456}:3456"

    volumes:
      - ${CONTAINERS_DATA:?Set CONTAINERS_DATA in the environment file}/db:/db
      - ${CONTAINERS_DATA:?Set CONTAINERS_DATA in the environment file}/files:/app/vikunja/files

    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL:?Set VIKUNJA_SERVICE_PUBLICURL in the environment file}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET:?Set VIKUNJA_SERVICE_SECRET in the environment file}
      TZ: ${TZ:-America/Toronto}
