name: voicebox

services:
  voicebox:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    build:
      context: ${CONTAINERS_DATA}/build-context
    container_name: voicebox
    restart: unless-stopped

    ports:
      - "192.168.1.32:17600:17493"

    volumes:
      - ${CONTAINERS_DATA}/data:/app/data
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false
      - ${CONTAINERS_DATA}/models:/home/voicebox/.cache/huggingface

    environment:
      LOG_LEVEL: info
      NUMBA_CACHE_DIR: /tmp/numba_cache

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  mp3-converter:
    image: voicebox:8af7efe62fab8d33e2a5dfbedabaa45f68a5184f
    container_name: voicebox-mp3-converter
    restart: unless-stopped

    healthcheck:
      disable: true

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        output_dir=/app/data/generations
        while :; do
          for wav in "$$output_dir"/*.wav; do
            [ -f "$$wav" ] || continue
            mp3=$${wav%.wav}.mp3
            if [ -f "$$mp3" ] && [ ! "$$wav" -nt "$$mp3" ]; then
              continue
            fi
            size_before=$$(stat -c '%s' "$$wav" 2>/dev/null || echo 0)
            [ "$$size_before" -gt 44 ] || continue
            sleep 2
            size_after=$$(stat -c '%s' "$$wav" 2>/dev/null || echo 0)
            [ "$$size_before" = "$$size_after" ] || continue
            temp_mp3=$${mp3%.mp3}.tmp.mp3
            if ffmpeg -nostdin -hide_banner -loglevel error -y \
              -i "$$wav" -codec:a libmp3lame -q:a 2 "$$temp_mp3"; then
              mv -f "$$temp_mp3" "$$mp3"
              echo "Created $$mp3"
            else
              rm -f "$$temp_mp3"
              echo "Could not convert $$wav" >&2
            fi
          done
          sleep 5
        done

    volumes:
      - type: bind
        source: /mnt/media/podcast/manual
        target: /app/data/generations
        bind:
          create_host_path: false

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.37.0
    container_name: text-to-audio-docling
    restart: unless-stopped

    ports:
      - "192.168.1.32:17602:5001"

    environment:
      DOCLING_DEVICE: cpu
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_LOG_LEVEL: INFO

    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G

  defuddle:
    image: defuddle-api:0.19.5
    build:
      context: ${CONTAINERS_DATA}/build-context/defuddle-api
    container_name: text-to-audio-defuddle
    restart: unless-stopped

    ports:
      - "192.168.1.32:17601:8080"

    environment:
      PORT: "8080"
      OUTPUT_DIR: /output
      PUBLIC_BASE_URL: http://192.168.1.32:17601
      OUTPUT_HOST_PATH: /mnt/media/podcast/manual

    volumes:
      - type: bind
        source: /mnt/media/podcast/manual
        target: /output
        bind:
          create_host_path: false

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  workflow:
    image: text-to-audio-workflow:1.0.0
    build:
      context: ${CONTAINERS_DATA}/workflow
    container_name: text-to-audio-workflow
    restart: unless-stopped

    ports:
      - "192.168.1.32:17603:8080"

    environment:
      STATE_DIR: /state
      OUTPUT_DIR: /mnt/media/audiobooks
      GENERATIONS_DIR: /mnt/media/podcast/manual
      VOICEBOX_URL: http://voicebox:17493
      DEFUDDLE_URL: http://defuddle:8080
      DOCLING_URL: http://docling:5001
      MP3_WAIT_SECONDS: "43200"

    volumes:
      - ${CONTAINERS_DATA}/workflow-data:/state
      - type: bind
        source: /mnt/media/audiobooks
        target: /mnt/media/audiobooks
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/media/podcast/manual
        target: /mnt/media/podcast/manual
        bind:
          create_host_path: false

    depends_on:
      - voicebox
      - mp3-converter
      - docling
      - defuddle

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
